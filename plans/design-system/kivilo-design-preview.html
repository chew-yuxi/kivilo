  #caption { margin-top:18px; font-size:14px; color:#4b5563 }
  figure { max-width:390px; width:100%; margin-inline:auto }

  const options = document.getElementById('options');
  const screenButtons = Array.from(document.querySelectorAll('[data-screen]'));
  function showScreen(key) {
    const views = screens[key];
    const screenName = screenButtons.find(button => button.dataset.screen === key).textContent;
    screenButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.screen === key)));
    options.replaceChildren();
    function showView(index) {
      const view = views[index];
      capture.src = view.src;
      capture.alt = screenName + '. ' + view.caption;
      document.getElementById('caption').textContent = view.caption;
      Array.from(options.children).forEach((button, i) => button.setAttribute('aria-pressed', String(i === index)));
    }
    for (const [i, view] of views.entries()) {
      const button = document.createElement('button');
      button.type = 'button'; button.textContent = view.label;
      button.addEventListener('click', () => showView(i));
      options.append(button);
    }
    document.getElementById('states').hidden = views.length === 1;
    showView(0);
  }
  screenButtons.forEach(button => button.addEventListener('click', () => showScreen(button.dataset.screen)));
  showScreen('properties');
